name: Tagged Test Builds

on:
  workflow_dispatch:
  push:
    tags:
      - 'v[0-9].[0-9]+.[0-9]+-alpha*'
      - 'v[0-9].[0-9]+.[0-9]+-beta*'

jobs:
  all_jobs:
    name: Tests, Builds, Coverage, Artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Commit
        uses: actions/checkout@v7
      - name: Use Node.js 22.x
        uses: actions/setup-node@v7
        with:
          node-version: '22.x'
      - name: Install Dependencies (npm ci)
        run: npm ci --no-fund
      - name: Run Tests
        run: npm run test -- --verbose
      - name: Run Lint
        run: npm run lint
      - name: Validate Tag Version
        if: github.event_name == 'push'
        shell: bash
        run: |
          package_version=$(node -p "require('./package.json').version")
          tag_version="${GITHUB_REF_NAME#v}"
          base_tag_version="${tag_version%%-*}"
          if [[ "$base_tag_version" != "$package_version" ]]; then
            echo "Tag base version $base_tag_version does not match package version $package_version." >&2
            exit 1
          fi
      - name: Run Build
        run: npm run build
        env:
          GITSHA: ${{ github.event.after }}
      - name: Generate SHA-256 Checksums
        shell: bash
        run: |
          cd builds
          sha256sum \
            Cookie-AutoDelete-Next-Edition_*_Chrome.zip \
            Cookie-AutoDelete-Next-Edition_*_Firefox-unsigned.zip \
            > SHA256SUMS.txt
      - name: Archive Test Build Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: builds
          path: |
            builds/Cookie-AutoDelete-Next-Edition_*_Chrome.zip
            builds/Cookie-AutoDelete-Next-Edition_*_Firefox-unsigned.zip
            builds/SHA256SUMS.txt
          if-no-files-found: error
      - name: Codecov.io Coverage upload
        uses: codecov/codecov-action@v7
        with:
          fail_ci_if_error: true
          directory: ./coverage/
          token: ${{ secrets.CODECOV_TOKEN }} # Optional as it is open source repo
      - name: Coveralls.io Coverage Upload
        uses: coverallsapp/github-action@v2.3.8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
